<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latihan TKA Bilangan Cacah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: aplikasi ujian dua kolom (soal di kiri, navigasi nomor di kanan); satu kolom di ponsel.
   Palet: biru ujian, netral kebiruan, kuning hanya untuk ragu-ragu. Tipe: Space Grotesk untuk judul dan angka, Inter untuk teks. */
:root{
  color-scheme:light;
  --bg:#f2f5fb; --surface:#ffffff; --surface-2:#eaf0fa; --fg:#14213d; --muted:#586683; --line:#d5deec;
  --accent:#1f5fd6; --accent-2:#e3ecff; --accent-fg:#ffffff;
  --good:#136b41; --good-bg:#e2f4e9; --good-line:#4fae7b; --bad:#b3261e; --bad-bg:#fcebe9; --bad-line:#e0877f; --warn:#7a4f00; --warn-bg:#fff1d0;
  --figbg:#eef3fb; --shadow:0 1px 2px rgba(20,33,61,.06),0 4px 14px rgba(20,33,61,.05);
  --f-head:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1526; --surface:#152036; --surface-2:#1b2943; --fg:#e8eefb; --muted:#9bacc9; --line:#2a3b5c;
  --accent:#78a6ff; --accent-2:#1c2f57; --accent-fg:#0a1222;
  --good:#6fd79a; --good-bg:#12301f; --good-line:#3f9a68; --bad:#ff9a90; --bad-bg:#3a1b1a; --bad-line:#a8524b; --warn:#ffd277; --warn-bg:#3a2d10;
  --figbg:#1d2b46; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1526; --surface:#152036; --surface-2:#1b2943; --fg:#e8eefb; --muted:#9bacc9; --line:#2a3b5c;
  --accent:#78a6ff; --accent-2:#1c2f57; --accent-fg:#0a1222;
  --good:#6fd79a; --good-bg:#12301f; --good-line:#3f9a68; --bad:#ff9a90; --bad-bg:#3a1b1a; --bad-line:#a8524b; --warn:#ffd277; --warn-bg:#3a2d10;
  --figbg:#1d2b46; --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.2}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:20px 48px}

.top{position:sticky;top:0;z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:15px;flex:none}
.brand b{font-family:var(--f-head);font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.timer{font-family:var(--f-head);font-weight:600;font-size:15px;background:var(--accent-2);border-color:transparent;color:var(--accent)}
.chip.timer.low{background:var(--warn-bg);color:var(--warn)}
@media (max-width:640px){.cd{display:none}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:20px}
@media (max-width:480px){.pad{padding:16px}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.flag.on{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.muted{color:var(--muted)}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--accent-2);color:var(--accent)}
.badge.warn{background:var(--warn-bg);color:var(--warn)} .badge.plain{background:var(--surface-2);color:var(--muted)}

.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{font-size:clamp(26px,4.4vw,36px);margin-bottom:8px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:18px 0;padding:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;font-weight:600}
.field{display:grid;gap:6px;margin:18px 0 14px}
.field label{font-weight:600}
.field input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;min-height:44px;width:100%}
.hier{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
.hier dt{color:var(--muted);font-weight:600}
.hier dd{margin:0}
.mat{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.mat li{display:flex;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2)}
.mat b{font-variant-numeric:tabular-nums;white-space:nowrap}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}.side{order:-1;position:static!important}}
.side{position:sticky;top:76px;display:grid;gap:14px}
.side h2{font-size:15px;margin-bottom:10px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.nav button{aspect-ratio:1;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-family:var(--f-head);font-weight:600;font-size:16px;cursor:pointer}
.nav button.done{background:var(--accent-2);border-color:var(--accent);color:var(--accent)}
.nav button.flag{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.nav button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line);vertical-align:-1px;margin-right:5px}
.legend .l1{background:var(--accent-2);border-color:var(--accent)} .legend .l2{background:var(--warn-bg);border-color:var(--warn)} .legend .l3{background:var(--accent);border-color:var(--accent)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:14px}
.qcode{font-family:var(--f-head);font-size:13px;color:var(--muted);letter-spacing:.04em;margin-right:auto}
details.hierbox{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);margin-bottom:16px}
details.hierbox summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--accent)}
details.hierbox .hier{padding:0 14px 14px;font-size:13.5px}
.stem{margin:0 0 8px;max-width:68ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0 16px}
.figs.n1{grid-template-columns:minmax(0,280px)}
.figs.n2{grid-template-columns:repeat(2,minmax(0,200px))}
@media (max-width:420px){.figs.n2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{margin:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.fig .ico{background:var(--figbg);padding:8px 10px}
.fig svg{display:block;width:100%;height:auto;max-height:104px}
.fig figcaption{padding:9px 12px 11px;display:grid;gap:2px}
.fig .nm{font-size:12.5px;font-weight:600;color:var(--muted)}
.fig .val{font-family:var(--f-head);font-weight:700;font-size:18px;display:flex;align-items:baseline;flex-wrap:wrap}
.unit{font-size:.7em;font-weight:600;color:var(--muted);margin-left:.3em}
.ask{font-weight:600;font-size:16.5px;margin:14px 0 8px;max-width:62ch}
.mcma{margin:0 0 12px;color:var(--accent);font-weight:700;font-size:14px}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--surface);min-height:50px}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--accent);background:var(--accent-2)}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin:0}
.opt .lt{font-family:var(--f-head);font-weight:700;color:var(--muted);width:1.2em;flex:none}
.opt .tx{min-width:0;overflow-wrap:anywhere;flex:1}
.stamp{margin:14px 0 0;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 16px;font-variant-numeric:tabular-nums}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.foot .r{display:flex;gap:10px;flex-wrap:wrap}

.scrim{position:fixed;inset:0;background:rgba(8,14,28,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal{max-width:420px;width:100%;padding:22px}
.modal h2{font-size:19px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.rhero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
@media (max-width:560px){.rhero{grid-template-columns:minmax(0,1fr)}}
.rname-l{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.rname{margin:0 0 12px;font-family:var(--f-head);font-weight:700;font-size:24px;line-height:1.2;overflow-wrap:anywhere}
.score{font-family:var(--f-head);font-weight:700;font-size:64px;line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--muted);font-weight:600}
.times{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-variant-numeric:tabular-nums}
.times dt{color:var(--muted)} .times dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.sb{margin-top:18px;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.sb.ok{background:var(--good-bg);border-color:var(--good-line)} .sb.no{background:var(--bad-bg);border-color:var(--bad-line)}
.sb h3{font-size:16px;margin-bottom:4px} .sb.ok h3{color:var(--good)} .sb.no h3{color:var(--bad)}
.sb p{margin:0 0 10px;max-width:64ch}
.sb .times{margin-bottom:12px}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.nav button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<div class="top"><div class="wrap">
  <div class="brand"><div class="logo" aria-hidden="true">T</div><div><b>Latihan TKA</b><small>Numerasi · Kelas 6 · Bilangan Cacah</small></div></div>

</div></div>
<main class="wrap" id="app"></main>

<script>
(function(){
"use strict";
var N=10, TOTAL=25*60, KEY="tka-numerasi-bilangan-cacah-v1", L=["A","B","C","D","E"];
/* Pengiriman nilai ke Google Apps Script */
var ENDPOINT="https://script.google.com/macros/s/AKfycbyexhoYhE3W4GH3P348_9y7uTvCGIK-cF_m6NB-1d87rwcQtD4cOG3Fyob6zA-UcyHQ/exec";

function clock(t){return fTime.format(t)+" WIB"}
function stamp(t){return fDate.format(t)+" · "+clock(t)}
function dur(ms){var s=Math.max(0,Math.round(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fmt(s){
  if(!s)return "";
  var m=s.match(/^([\d.,%]+)\s+(\D.*)$/);
  if(m)return '<span>'+m[1]+'</span><span class="unit">'+m[2]+'</span>';
  return '<span>'+s+'</span>';
}

/* ---------- ilustrasi (viewBox 120x84) ---------- */
var FF='font-family="Space Grotesk,Inter,sans-serif"';

}

    p+='<g transform="rotate('+a+' '+x+' 60)"><rect x="'+(x-4)+'" y="16" width="8" height="46" fill="'+cs[i]+'"/><polygon points="'+(x-4)+',16 '+(x+4)+',16 '+x+',5" fill="#f1d3a6"/><polygon points="'+(x-1.6)+',8.5 '+(x+1.6)+',8.5 '+x+',5" fill="#333"/></g>';}

function bunsI(){

}

  return svg(p+'<rect x="14" y="44" width="92" height="36" rx="4" fill="#f4ecd8" stroke="#b08a4a" stroke-width="2"/><rect x="26" y="54" width="36" height="16" rx="3" fill="#e4572e"/><path d="M32 62h24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>');
}
function chairsI(){
  var p="",r,c;
  for(r=0;r<6;r++)for(c=0;c<10;c++){var x=8+c*10.6,y=6+r*13;p+='<rect x="'+x+'" y="'+y+'" width="8" height="3" rx="1" fill="#2f4a6e"/><rect x="'+x+'" y="'+(y+4)+'" width="8" height="6" rx="1.5" fill="#5b7aa0"/>';}
  return svg(p);
}
function cardI(n,c){
  return svg('<rect x="34" y="4" width="52" height="76" rx="7" fill="#fff" stroke="'+c+'" stroke-width="3"/><text x="60" y="52" text-anchor="middle" font-size="27" font-weight="700" '+FF+' fill="'+c+'">'+n+'</text><circle cx="43" cy="14" r="2.6" fill="'+c+'"/><circle cx="77" cy="70" r="2.6" fill="'+c+'"/>');
}
function shelfI(){
  var cs=["#e4572e","#2e86de","#f2b134","#3a9b6a","#9b5de5","#d94f7a"],p='<rect x="12" y="4" width="96" height="78" rx="3" fill="#8a5a36"/>',s,k;

}
function eggsI(broken){
  var p='<path d="M10 40h100l-8 38H18z" fill="#cdb58a" stroke="#9b8456" stroke-width="2"/>',r,c;

function eggGrid(){
  var p='<rect x="12" y="6" width="96" height="72" rx="6" fill="#cdb58a" stroke="#9b8456" stroke-width="2"/>',r,c;
  for(r=0;r<5;r++)for(c=0;c<6;c++){p+='<ellipse cx="'+(24+c*14.4)+'" cy="'+(18+r*14)+'" rx="5.4" ry="6.2" fill="#fff6e6" stroke="#e0cfa8" stroke-width="1"/>';}

  return svg('<path d="M30 18h60l-5 62H35z" fill="'+c+'"/><path d="M30 18l6 5 6-5 6 5 6-5 6 5 6-5 6 5 6-5 6 5 4-5" stroke="#fff" stroke-width="2" fill="none" opacity=".8"/><circle cx="60" cy="48" r="13" fill="#fff" opacity=".92"/><path d="M53 48h14M60 41v14" stroke="'+c+'" stroke-width="3" stroke-linecap="round"/>');
}

/* ---------- hierarki indikator ---------- */
var H={
 op:[["Elemen","Bilangan"],["Subelemen","Bilangan Rasional"],["Kompetensi","Menggunakan penjumlahan/pengurangan/perkalian/pembagian dua bilangan cacah (bilangan dan hasil operasi maks. empat angka). (termasuk mengestimasi hasil operasi)"],["Indikator","Menggunakan operasi bilangan cacah (maks. empat angka) dan menyatakannya dalam berbagai bentuk. (4)"]],
 fk:[["Elemen","Bilangan"],["Subelemen","Bilangan Rasional"],["Kompetensi","Menentukan faktor suatu bilangan cacah dan mengenal bilangan prima"],["Indikator","Menentukan faktor dan mengenal bilangan prima dari suatu bilangan cacah serta menerapkannya dalam masalah kontekstual. (3)"]],

};

var MATERI=[["Operasi bilangan cacah",4],["Faktor dan bilangan prima",3],["Memodelkan kalimat matematika",3]];

/* ---------- state ---------- */
function blank(){var a=[],k;for(k=0;k<N;k++)a.push([]);return a}
function fresh(){return{screen:"start",name:"",startedAt:0,finishedAt:0,cur:0,enteredAt:0,ans:blank(),ansAt:Q.map(function(){return null}),flag:Q.map(function(){return false}),auto:false,sent:"",sentAt:null}}
var S=fresh(), confirmOpen=false, sending=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{var r=localStorage.getItem(KEY);if(!r)return null;var o=JSON.parse(r);return(o&&o.ans&&o.ans.length===N&&Array.isArray(o.ans[0]))?o:null}catch(e){return null}}
function now(){return Date.now()}
function remaining(t){return TOTAL*1000-((t||now())-S.startedAt)}
function nilai(){var g=0;Q.forEach(function(q,k){var a=S.ans[k];if(a.length===q.key.length&&a.every(function(v,j){return v===q.key[j]}))g++});return g*10}
function answered(){return S.ans.filter(function(a){return a.length>0}).length}

function begin(){
  var el=document.getElementById("name"),nm=(el&&el.value.trim())||"Peserta",t=now();
  S=fresh();S.name=nm.slice(0,40);S.screen="quiz";S.startedAt=t;S.enteredAt=t;
  save();render();window.scrollTo(0,0);
}
function go(i){S.cur=i;confirmOpen=false;save();render();window.scrollTo(0,0)}
function pick(i){
  var k=S.cur,q=Q[k],cur=S.ans[k].slice();
  if(q.multi){var p=cur.indexOf(i);if(p>=0)cur.splice(p,1);else cur.push(i);cur.sort(function(a,b){return a-b})}
  else cur=[i];
  S.ans[k]=cur;S.ansAt[k]=cur.length?now():null;
  save();render();
  var f=document.querySelector('input[name="opt"][value="'+i+'"]');if(f)f.focus();
}
function toggleFlag(){S.flag[S.cur]=!S.flag[S.cur];save();render()}
function finish(auto){
  var t=now(),end=auto?Math.min(t,S.startedAt+TOTAL*1000):t;
  S.finishedAt=end;S.screen="result";S.auto=!!auto;confirmOpen=false;
  save();render();window.scrollTo(0,0);
  sendScore();
}
function reset(){S=fresh();confirmOpen=false;sending=false;try{localStorage.removeItem(KEY)}catch(e){}render();window.scrollTo(0,0)}

function sendScore(){
  if(sending)return;
  sending=true;S.sent="sending";save();render();
  var data={nama:S.name,mapel:MAPEL,nilai:nilai()},p;
  try{
    /* no-cors + teks biasa: tidak memicu preflight, cocok untuk Apps Script. Balasan tidak dapat dibaca. */
    p=fetch(ENDPOINT,{method:"POST",mode:"no-cors",body:JSON.stringify(data)});
  }catch(e){p=Promise.reject(e)}
  p.then(function(){S.sent="sent";S.sentAt=now()})
   .catch(function(){S.sent="fail"})
   .then(function(){sending=false;save();if(S.screen==="result")render()});
}

/* ---------- tampilan ---------- */
function hierHtml(h){return '<dl class="hier">'+H[h].map(function(r){return '<dt>'+r[0]+'</dt><dd>'+r[1]+'</dd>'}).join("")+'</dl>'}

function startView(){
  return '<section class="hero">'+
  '<div class="card pad"><span class="badge">Pilihan Ganda dan Pilihan Ganda Kompleks</span>'+
  '<h1 style="margin-top:12px">Latihan TKA Numerasi: Bilangan Cacah</h1>'+
  '<p class="muted" style="margin:0;max-width:56ch">Sepuluh soal tentang operasi bilangan cacah, faktor dan bilangan prima, serta kalimat matematika. Kunci dan pembahasan tidak ditampilkan. Setelah selesai, hanya nilai akhir yang muncul dan dikirim ke gurumu.</p>'+
  '<dl class="facts"><dt>Jumlah soal</dt><dd>10 soal (8 pilihan ganda, 2 pilihan ganda kompleks)</dd><dt>Waktu</dt><dd>25 menit</dd><dt>Catatan waktu</dt><dd>Jam mulai, jam selesai, dan durasi dicatat</dd></dl>'+
  '<div class="field"><label for="name">Nama peserta</label><input id="name" type="text" maxlength="40" autocomplete="name" placeholder="Tulis namamu"></div>'+
  '<button class="btn primary" data-act="begin" style="width:100%">Mulai mengerjakan</button></div>'+
  '<div class="card pad"><h2 style="font-size:17px;margin-bottom:12px">Materi yang diuji</h2><ul class="mat">'+
  MATERI.map(function(m){return '<li><span>'+m[0]+'</span><b>'+m[1]+' soal</b></li>'}).join("")+'</ul>'+
  '<h2 style="font-size:17px;margin:20px 0 8px">Petunjuk</h2><ol style="margin:0;padding-left:20px;display:grid;gap:6px">'+
  '<li>Pada pilihan ganda, pilih satu jawaban.</li>'+
  '<li>Pada pilihan ganda kompleks, klik setiap jawaban yang benar. Jawaban benar lebih dari satu, dan soal dinilai benar hanya jika semua jawaban benar terpilih.</li>'+
  '<li>Jawaban bisa diubah sampai kamu menekan Selesai. Gunakan Ragu-ragu untuk menandai soal yang ingin dicek lagi.</li></ol></div></section>';
}

function quizView(){
  var q=Q[S.cur],i=S.cur,t=now(),a=S.ans[i],n=answered();
  var navs=Q.map(function(_,k){
    var c=k===i?"cur":(S.flag[k]?"flag":(S.ans[k].length?"done":""));
    return '<button class="'+c+'" data-act="go" data-i="'+k+'" aria-label="Soal '+(k+1)+(S.ans[k].length?", sudah dijawab":", belum dijawab")+(S.flag[k]?", ragu-ragu":"")+'"'+(k===i?' aria-current="true"':'')+'>'+(k+1)+'</button>';
  }).join("");
  var cnt=q.figs.length,fcls="figs"+(cnt===1?" n1":(cnt===2?" n2":""));
  var figs=q.figs.map(function(f){return '<figure class="fig"><div class="ico">'+f.i+'</div><figcaption><span class="nm">'+f.n+'</span>'+(f.v?'<span class="val">'+fmt(f.v)+'</span>':'')+'</figcaption></figure>'}).join("");
  var paras=function(arr){return arr.map(function(s){return '<p class="stem">'+s+'</p>'}).join("")};
  var type=q.multi?"checkbox":"radio";
  var opts=q.opts.map(function(o,k){
    var on=a.indexOf(k)>=0;
    return '<li><label class="opt'+(on?" sel":"")+'"><input type="'+type+'" name="opt" value="'+k+'"'+(on?" checked":"")+'><span class="lt">'+L[k]+'.</span><span class="tx">'+o+'</span></label></li>';
  }).join("");
  var stamps='<span>'+(S.ansAt[i]?'Dijawab pukul <b>'+clock(S.ansAt[i])+'</b>':'Belum dijawab')+'</span>';
  var last=i===N-1;
  var modal=confirmOpen?'<div class="scrim" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="card modal"><h2 id="mt">Akhiri latihan?</h2><p class="muted" style="margin:0">'+(n<N?(N-n)+' soal belum dijawab. ':'Semua soal sudah dijawab. ')+'Setelah diakhiri, jawaban tidak bisa diubah dan nilai langsung dikirim.</p><div class="acts"><button class="btn" data-act="cancel">Kembali mengerjakan</button><button class="btn primary" data-act="finish">Ya, akhiri</button></div></div></div>':'';
  return '<div class="layout"><section class="card pad" aria-labelledby="qh">'+
   '<div class="qhead"><span class="qcode" id="qh">SOAL '+(i+1)+' DARI '+N+'</span><span class="badge '+(q.multi?"warn":"plain")+'">'+(q.multi?"Pilihan Ganda Kompleks - MCMA":"Pilihan Ganda")+'</span></div>'+
   '<details class="hierbox"><summary>Hierarki indikator</summary>'+hierHtml(q.h)+'</details>'+
   paras(q.pre)+'<div class="'+fcls+'">'+figs+'</div>'+paras(q.post)+
   '<p class="ask">'+q.ask+'</p>'+(q.multi?'<p class="mcma">Klik pada setiap jawaban benar! Jawaban benar lebih dari satu.</p>':'')+
   '<ul class="opts" role="group" aria-labelledby="qh">'+opts+'</ul>'+
   '<div class="stamp">'+stamps+'</div>'+
   '<div class="foot"><button class="btn" data-act="go" data-i="'+(i-1)+'"'+(i===0?" disabled":"")+'>Sebelumnya</button><div class="r"><button class="btn flag'+(S.flag[i]?" on":"")+'" data-act="flag" aria-pressed="'+S.flag[i]+'">Ragu-ragu</button>'+
   (last?'<button class="btn primary" data-act="ask">Selesai</button>':'<button class="btn primary" data-act="go" data-i="'+(i+1)+'">Berikutnya</button>')+'</div></div></section>'+
   '<aside class="side"><div class="card pad"><h2>Navigasi soal</h2><div class="nav">'+navs+'</div>'+
   '<div class="legend"><span><i class="l1"></i>Dijawab</span><span><i class="l2"></i>Ragu-ragu</span><span><i class="l3"></i>Sekarang</span></div></div>'+
   '<div class="card pad"><dl class="times"><dt>Peserta</dt><dd>'+esc(S.name)+'</dd><dt>Mulai</dt><dd>'+clock(S.startedAt)+'</dd><dt>Dijawab</dt><dd>'+n+' dari '+N+'</dd></dl>'+
   '<button class="btn" data-act="ask" style="width:100%;margin-top:14px">Akhiri latihan</button></div></aside></div>'+modal;
}

function sendHtml(){
  var st=S.sent,cls="sb",msg,btn="";
  if(st==="sending"){msg="Mengirim nilai ke Google Apps Script..."}
  else if(st==="sent"){cls="sb ok";msg="Nilai dikirim pukul "+clock(S.sentAt)+". Cek spreadsheet untuk memastikan barisnya sudah masuk."}
  else{cls="sb no";msg="Nilai belum terkirim. Periksa koneksi internet, lalu kirim ulang.";btn='<button class="btn primary" data-act="send">Kirim ulang</button>'}
  return '<div class="'+cls+'" role="status" aria-live="polite"><h3>Pengiriman nilai</h3><p>'+msg+'</p>'+
    '<dl class="times"><dt>Nama</dt><dd>'+esc(S.name)+'</dd><dt>Mapel</dt><dd>'+esc(MAPEL)+'</dd><dt>Nilai</dt><dd>'+nilai()+'</dd></dl>'+btn+'</div>';
}

function resultView(){
  return '<section class="card pad"><div class="rhero"><div><p class="rname-l">Nama siswa</p><p class="rname">'+esc(S.name)+'</p><p class="rname-l">Nilai akhir</p><div class="score">'+nilai()+'<small> / 100</small></div></div>'+
   '<dl class="times"><dt>Mulai</dt><dd>'+stamp(S.startedAt)+'</dd><dt>Selesai</dt><dd>'+stamp(S.finishedAt)+(S.auto?" (waktu habis)":"")+'</dd><dt>Durasi</dt><dd>'+dur(S.finishedAt-S.startedAt)+' dari 25:00</dd></dl></div>'+
   sendHtml()+
   '<div style="margin-top:18px"><button class="btn" data-act="reset">Mulai ulang</button></div></section>';
}

function render(){
  var app=document.getElementById("app");
  app.innerHTML=S.screen==="quiz"?quizView():(S.screen==="result"?resultView():startView());
  tick();
}
function tick(){
  var t=now(),c=document.getElementById("clk"),tm=document.getElementById("tmr");
  if(c)c.innerHTML='<span class="cd">'+fDate.format(t)+' · </span>'+clock(t);
  if(S.screen==="quiz"){
    var rem=remaining(t);
    if(rem<=0){finish(true);return}
    tm.hidden=false;tm.textContent="Sisa "+dur(rem);tm.classList.toggle("low",rem<=180000);
  }else{tm.hidden=true}
}

var app=document.getElementById("app");
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  if(a==="begin")begin();
  else if(a==="go")go(+b.getAttribute("data-i"));
  else if(a==="flag")toggleFlag();
  else if(a==="ask"){confirmOpen=true;render()}
  else if(a==="cancel"){confirmOpen=false;render()}
  else if(a==="finish")finish(false);
  else if(a==="send")sendScore();
  else if(a==="reset")reset();
});
app.addEventListener("change",function(e){if(e.target&&e.target.name==="opt")pick(+e.target.value)});

var saved=load();
if(saved&&saved.screen==="result"&&saved.sent==="sending")saved.sent="fail";
if(saved&&(saved.screen==="quiz"||saved.screen==="result"))S=saved;
render();
if(S.screen==="quiz"&&remaining()<=0)finish(true);
setInterval(tick,1000);
})();
</script>
